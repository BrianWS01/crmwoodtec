<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — CRM WoodTec</title>
  <script>
    try { const t = localStorage.getItem('crm-tema'); if (t) document.documentElement.dataset.bsTheme = t; } catch {}
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="card shadow-sm login-card w-100">
      <div class="card-body p-4">
        <h1 class="h4 mb-1"><i class="bi bi-kanban me-2" aria-hidden="true"></i>CRM WoodTec</h1>
        <p class="text-body-secondary mb-4">Entre com o usuário criado no painel do Supabase.</p>

        <div id="login-erro" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" required autocomplete="username"
                   placeholder="seu-email@empresa.com.br" aria-describedby="email-dica">
            <div id="email-dica" class="form-text">O e-mail do usuário cadastrado em Authentication &gt; Users.</div>
            <div class="invalid-feedback">Informe um e-mail válido.</div>
          </div>
          <div class="mb-4">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password"
                   placeholder="Sua senha" aria-describedby="senha-dica">
            <div id="senha-dica" class="form-text">A senha definida ao criar o usuário no Supabase.</div>
            <div class="invalid-feedback">Informe a senha.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Entrar
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import('./js/auth.js')
      .then((m) => m.iniciarLogin())
      .catch((erro) => {
        console.error(erro);
        const el = document.getElementById('login-erro');
        el.innerHTML = 'Não foi possível iniciar. Verifique se o arquivo <code>js/config.js</code> existe ' +
          '(copie de <code>js/config.example.js</code>) e se você está usando um servidor local (ex.: Live Server).';
        el.classList.remove('d-none');
      });
  </script>
</body>
</html>
